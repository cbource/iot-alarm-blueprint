blueprint:
  name: Custom IoT Alarm System
  description: >
    A custom alarm automation blueprint. It allows you to select an input_boolean to arm/disarm the alarm,
    and then select multiple door/window sensors and motion sensors.
    If armed, any opening or motion will trigger the selected sirens and send a mobile notification.
    Optionally, you can select device trackers so that the alarm will only trigger if everyone is away (Geo-fencing).
  domain: automation
  input:
    alarm_enable:
      name: Alarm Enable Switch
      description: Select an input boolean to turn the alarm on and off.
      selector:
        entity:
          filter:
            domain: input_boolean
    door_window_sensors:
      name: Door / Window Sensors
      description: Select the door, window, or opening sensors to monitor.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: door
            - domain: binary_sensor
              device_class: window
            - domain: binary_sensor
              device_class: opening
          multiple: true
    motion_sensors:
      name: Motion Sensors
      description: Select the motion, presence, or occupancy sensors to monitor.
      default: []
      selector:
        entity:
          filter:
            - domain: binary_sensor
              device_class: motion
            - domain: binary_sensor
              device_class: occupancy
            - domain: binary_sensor
              device_class: presence
          multiple: true
    device_trackers:
      name: Device Trackers (Geo / Away Mode)
      description: (Optional) If selected, the alarm will ONLY trigger if ALL these trackers are "not_home" (away).
      default: []
      selector:
        entity:
          filter:
            - domain: device_tracker
            - domain: person
          multiple: true
    alarm_actions:
      name: Alarm Trigger Actions
      description: Define EXACTLY what happens when the alarm triggers. (e.g., Add Action -> Device -> Eufy -> Press Button, or Turn on Siren).
      default: []
      selector:
        action: {}
    silence_actions:
      name: Silence Actions
      description: Define EXACTLY what happens when you click 'Silence Alarms' on your phone. (e.g., Add Action -> Turn off Siren).
      default: []
      selector:
        action: {}
    trigger_delay:
      name: Entry Delay (Seconds)
      description: How many seconds to wait before sounding the alarms. This gives you time to open the app and disarm it when you walk in.
      default: 10
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    notify_services:
      name: Notification Services
      description: Select the mobile app notification entities (e.g., notify.mobile_app_your_phone). You can select multiple phones here without needing a group!
      default: []
      selector:
        entity:
          domain: notify
          multiple: true

variables:
  device_trackers_var: !input device_trackers
  door_sensors_var: !input door_window_sensors
  motion_sensors_var: !input motion_sensors
  open_sensors: >
    {% set all = door_sensors_var + motion_sensors_var %}
    {{ expand(all) | selectattr('state', 'eq', 'on') | map(attribute='name') | list }}

trigger:
  - platform: state
    entity_id: !input door_window_sensors
    to: "on"
    id: "alarm_trigger"
  - platform: state
    entity_id: !input motion_sensors
    to: "on"
    id: "alarm_trigger"
  - platform: state
    entity_id: !input alarm_enable
    to: "on"
    id: "arming"

condition:
  - condition: or
    conditions:
      - condition: trigger
        id: "arming"
      - condition: and
        conditions:
          - condition: state
            entity_id: !input alarm_enable
            state: "on"
          - condition: template
            value_template: >
              {% if device_trackers_var | length > 0 %}
                {% set home_trackers = expand(device_trackers_var) | selectattr('state', 'eq', 'home') | list %}
                {{ home_trackers | length == 0 }}
              {% else %}
                true
              {% endif %}

mode: single

action:
  - choose:
      # Branch 1: Alarm Arming Check
      - conditions:
          - condition: trigger
            id: "arming"
          - condition: template
            value_template: "{{ open_sensors | length > 0 }}"
        sequence:
          - service: notify.send_message
            target:
              entity_id: !input notify_services
            data:
              message: "⚠️ Warning: The alarm was armed but these sensors are open: {{ open_sensors | join(', ') }}. Do you want to cancel?"
              title: "Alarm Arming Check"
              data:
                actions:
                  - action: "CANCEL_ARM"
                    title: "Cancel Arming"
                  - action: "BYPASS"
                    title: "Bypass & Arm"
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "CANCEL_ARM"
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "BYPASS"
            timeout:
              minutes: 1
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.trigger is not none and wait.trigger.event.data.action == 'CANCEL_ARM' }}"
                sequence:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: !input alarm_enable

      # Branch 2: Alarm Triggered
      - conditions:
          - condition: trigger
            id: "alarm_trigger"
        sequence:
          # Entry Delay
          - delay:
              seconds: !input trigger_delay
              
          # Ensure the alarm wasn't disarmed during the delay
          - condition: state
            entity_id: !input alarm_enable
            state: "on"

          # Action 1: Trigger Alarms (executes user-defined actions)
          - choose:
              - conditions: []
                sequence: !input alarm_actions

          # Send Actionable Notification to silence alarms
          - service: notify.send_message
            target:
              entity_id: !input notify_services
            data:
              message: "⚠️ ALARM TRIGGERED by {{ trigger.to_state.name }}!"
              title: "Security Alert"
              data:
                actions:
                  - action: "SILENCE_ALARM"
                    title: "Silence Alarms"
          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: "SILENCE_ALARM"
            timeout:
              hours: 1
            continue_on_timeout: false
            
          # Action 3: Silence Alarms (executes user-defined actions)
          - choose:
              - conditions: []
                sequence: !input silence_actions
